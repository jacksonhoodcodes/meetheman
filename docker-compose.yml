version: '3.9'
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: meetheman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/meetheman
      JWT_SECRET: super-secret
      ALLOWED_SCHOOL_DOMAINS: school.edu,other.edu
    depends_on:
      - db
    ports:
      - '8000:8000'

volumes:
  postgres_data:
