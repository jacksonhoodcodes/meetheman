name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: meetheman
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations/bootstrap
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/meetheman
          ALLOWED_SCHOOL_DOMAINS: school.edu,other.edu
        run: python scripts/init_db.py
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./test.db
          JWT_SECRET: test-secret
          ALLOWED_SCHOOL_DOMAINS: school.edu,other.edu
        run: pytest -q
